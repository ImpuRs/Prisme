<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --fond: #f3f4f1; --papier: #ffffff; --encre: #1d2321; --doux: #5f6b66; --trait: #dde1dc;
    --accent: #0f5c4d; --accent-doux: #e3efe9; --alerte: #a14a00; --alerte-fond: #fdf0e1;
    --erreur: #9b1c1c; --rayon: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--encre); background: var(--fond);
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px;
           background: var(--papier); border-bottom: 1px solid var(--trait); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header p { margin: 0; font-size: 12px; color: var(--doux); }
  #reset { border: 1px solid var(--trait); background: var(--papier); color: var(--encre); border-radius: 999px;
           padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  #fil { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 760px; width: fit-content; }
  .moi { align-self: flex-end; background: var(--accent); color: #fff; padding: 9px 14px; border-radius: var(--rayon) var(--rayon) 4px var(--rayon); }
  .bot { align-self: flex-start; width: 100%; }
  .intro { background: var(--papier); border: 1px solid var(--trait); padding: 10px 14px; border-radius: var(--rayon) var(--rayon) var(--rayon) 4px; width: fit-content; max-width: 100%; }
  .intro .affine { display: block; font-size: 12px; color: var(--doux); margin-bottom: 2px; }
  .intro.erreur { border-color: var(--erreur); color: var(--erreur); }
  .cartes { display: grid; gap: 8px; margin-top: 8px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .carte { background: var(--papier); border: 1px solid var(--trait); border-radius: 12px; padding: 10px 12px; }
  .carte .haut { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .code { font: 650 17px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .copier { border: none; background: var(--accent-doux); color: var(--accent); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .desig { margin: 4px 0 6px; font-weight: 550; }
  .meta { font-size: 13px; color: var(--doux); }
  .bas { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .prix { font-weight: 650; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-doux); color: var(--accent); }
  .badge.alerte { background: var(--alerte-fond); color: var(--alerte); }
  .choix { margin-top: 10px; }
  .choix p { margin: 0 0 6px; font-size: 13px; color: var(--doux); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--accent); background: var(--papier); color: var(--accent); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover, .copier:hover, #reset:hover { filter: brightness(0.96); }
  .duree { font-size: 11px; color: var(--doux); margin-top: 6px; }
  .attente { color: var(--doux); font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--papier); border-top: 1px solid var(--trait); }
  #saisie { flex: 1; min-width: 0; border: 1px solid var(--trait); border-radius: 999px; padding: 11px 16px; font: inherit; background: var(--fond); color: var(--encre); }
  #saisie:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #envoyer { border: none; background: var(--accent); color: #fff; border-radius: 999px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #envoyer:disabled { opacity: .5; cursor: default; }
  .accueil { color: var(--doux); font-size: 14px; }
  .accueil b { color: var(--encre); }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #151a18; --papier: #1e2522; --encre: #e7ece9; --doux: #9aa7a1; --trait: #2e3733;
            --accent: #5fbfa6; --accent-doux: #21342e; --alerte: #f0a35e; --alerte-fond: #3a2a1a; --erreur: #f08a8a; }
    .moi, #envoyer { color: #0d1a16; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Assistant vendeur</h1>
      <p>Code article, EAN, réf. fournisseur ou mots-clés</p>
    </div>
    <button id="reset" type="button" title="Oublier la recherche en cours">Nouvelle recherche</button>
  </header>

  <main id="fil" aria-live="polite">
    <div class="msg bot"><div class="intro accueil">
      Exemples : <b>622083</b> · <b>3258950307275</b> · <b>ferme-porte TS4000 blanc</b> · <b>receveur 120x80</b><br>
      Quand il y a plusieurs résultats, précise simplement (« blanc », « geze »…) : je garde la recherche en cours.
    </div></div>
  </main>

  <form id="form" autocomplete="off">
    <input id="saisie" type="text" placeholder="Ta question…" aria-label="Ta question" enterkeyhint="send">
    <button id="envoyer" type="submit">Envoyer</button>
  </form>

<script>
  var contexte = null;
  var fil = document.getElementById('fil'), saisie = document.getElementById('saisie'), bouton = document.getElementById('envoyer');

  function el(tag, cls, texte) { var e = document.createElement(tag); if (cls) e.className = cls; if (texte != null) e.textContent = texte; return e; }
  function defiler() { fil.scrollTop = fil.scrollHeight; }

  function copier(texte, btn) {
    var fini = function () { btn.textContent = 'Copié'; setTimeout(function () { btn.textContent = 'Copier'; }, 1200); };
    try { navigator.clipboard.writeText(texte).then(fini, secours); } catch (e) { secours(); }
    function secours() { var t = el('textarea'); t.value = texte; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); fini(); } catch (e) {} t.remove(); }
  }

  function carte(a) {
    var c = el('div', 'carte'), haut = el('div', 'haut'), b = el('button', 'copier', 'Copier');
    haut.appendChild(el('span', 'code', a.code)); b.type = 'button'; b.onclick = function () { copier(a.code, b); }; haut.appendChild(b);
    c.appendChild(haut);
    c.appendChild(el('div', 'desig', a.designation));
    c.appendChild(el('div', 'meta', a.marque + ' · réf. ' + a.ref + (a.ean ? ' · EAN ' + a.ean : '')));
    var bas = el('div', 'bas'), g = el('div');
    g.appendChild(el('span', 'badge', a.stock));
    if (a.pageCatalogue) { g.appendChild(document.createTextNode(' ')); g.appendChild(el('span', 'badge', 'Catalogue p. ' + a.pageCatalogue)); }
    a.alertes.forEach(function (t) { g.appendChild(document.createTextNode(' ')); g.appendChild(el('span', 'badge alerte', t)); });
    bas.appendChild(g); bas.appendChild(el('span', 'prix', a.prix + ' € HT / ' + a.unite));
    c.appendChild(bas);
    return c;
  }

  function afficher(r) {
    var m = el('div', 'msg bot'), intro = el('div', 'intro');
    if (r.affinage) intro.appendChild(el('span', 'affine', 'Recherche affinée : ' + r.recherche +
      r.filtres.map(function (f) { return ' · ' + f.axe + ' = ' + f.valeur; }).join('')));
    intro.appendChild(document.createTextNode(r.intro));
    m.appendChild(intro);
    if (r.articles.length) { var g = el('div', 'cartes'); r.articles.forEach(function (a) { g.appendChild(carte(a)); }); m.appendChild(g); }
    if (r.choix) {
      var ch = el('div', 'choix'), chips = el('div', 'chips');
      ch.appendChild(el('p', null, 'Préciser la ' + r.choix.axe + ' :'));
      r.choix.valeurs.forEach(function (v, i) {
        var b = el('button', 'chip', v + ' (' + r.choix.comptes[i] + ')'); b.type = 'button';
        b.onclick = function () { envoyer(v, { axe: r.choix.axe, valeur: v }); }; chips.appendChild(b);
      });
      ch.appendChild(chips); m.appendChild(ch);
    }
    m.appendChild(el('div', 'duree', r.duree.toFixed(1) + ' s'));
    fil.appendChild(m); defiler();
  }

  function envoyer(texte, choix) {
    texte = (texte || '').trim(); if (!texte) return;
    fil.appendChild(el('div', 'msg moi', texte));
    var att = el('div', 'msg bot attente', 'Recherche…'); fil.appendChild(att); defiler();
    saisie.value = ''; bouton.disabled = true;
    google.script.run
      .withSuccessHandler(function (r) { att.remove(); bouton.disabled = false; contexte = { type: r.type, recherche: r.recherche, filtres: r.filtres }; afficher(r); saisie.focus(); })
      .withFailureHandler(function (e) { att.remove(); bouton.disabled = false;
        var m = el('div', 'msg bot'); m.appendChild(el('div', 'intro erreur', 'Erreur : ' + (e && e.message || e))); fil.appendChild(m); defiler(); })
      .chatRepondre(texte, contexte, choix || null);
  }

  document.getElementById('form').onsubmit = function (e) { e.preventDefault(); envoyer(saisie.value); };
  document.getElementById('reset').onclick = function () {
    contexte = null; fil.appendChild(el('div', 'msg bot attente', '— Nouvelle recherche —')); defiler(); saisie.focus();
  };
  saisie.focus();
</script>
</body>
</html>
